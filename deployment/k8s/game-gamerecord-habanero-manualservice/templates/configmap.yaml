apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-bti-manualservice.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "BTI",
        "MinIntervalMinute": 5,
        "MaxIntervalMinute": 30,
        "IntervalMinute": 15,
        "LockMinute": 14,
        "MongoDefine":  "gp.gamerecord.database.manual",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.manual.bti",
        "GameExternalId": "sports_book"
      },
      "NatsSetting": {
        "Queue": "gp.gamerecord.manual",
        "Subject": "gp.gamerecord.manual.bti"
      },
      "GameRecord": {
         "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-bti-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
