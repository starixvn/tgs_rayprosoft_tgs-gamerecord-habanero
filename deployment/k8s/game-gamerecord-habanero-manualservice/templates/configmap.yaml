apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-habanero-manualservice.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "HABATF",
        "MinIntervalMinute": 1,        
        "IntervalMinute": 3,
        "LockMinute": 2,
        "MongoDefine":  "gp.gamerecord.database.manual",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.manual.habanero"        
      },
      "NatsSetting": {
        "Queue": "gp.gamerecord.manual",
        "Subject": "gp.gamerecord.manual.habanero"
      },
      "GameRecord": {
         "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-habanero-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
